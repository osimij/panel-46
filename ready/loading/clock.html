<style>
.ld-clock {
  width: var(--ld-size, 1.25em);
  height: var(--ld-size, 1.25em);
}

.ld-clock-spin {
  transform-origin: center;
  animation: ld-clock-rotate var(--ld-duration, 1200ms) linear infinite;
  animation-play-state: var(--ld-play-state, running);
}

.ld-clock-spin-ease-in-out {
  animation-timing-function: ease-in-out;
}

.ld-clock-spin-stacked {
  animation-name: ld-clock-rotate, ld-clock-rotate;
  animation-timing-function: linear, ease-in-out;
  animation-composition: add;
}

@keyframes ld-clock-rotate {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .ld-clock,
  .ld-clock * {
    animation: none;
  }
}
</style>
